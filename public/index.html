<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Sudoku</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="style.css" rel="stylesheet">
        <link href="manifest.json" rel="manifest">
        <link rel="icon" href="./icons/favicon.ico">
    </head>
    <body>
        <h1>Sudoku</h1>
        <dialog id="new-board-dialog">
            <div id="dialog-content">
                <h2>New Puzzle</h2>
                <label>
                    Clues: <input class="dialog-input" type="number" id="clue-count" min="17" max="81" value="30">
                </label>
                <label>
                    Load String: <input type="text" id="puzzle-string" class="dialog-input" placeholder="81 chars..." maxlength="81" minlength="81">
                </label>
                <div id="bank-controls">
                    <select id="bank-difficulty" class="dialog-input">
                        <option value="easy">Easy</option>
                        <option value="medium">Medium</option>
                        <option value="hard">Hard</option>
                        <option value="diabolical">Diabolical</option>
                    </select>
                    <button class="panel-btn" id="random-btn" type="button">Random</button>
                </div>
                <div id="dialog-actions">
                    <button class="panel-btn" id="load-btn">Load</button>
                    <button class="panel-btn" id="generate-btn" autofocus>Generate</button>
                    <button class="panel-btn" id="dialog-cancel" formmethod="dialog">Cancel</button>
                </div>
            </div>
        </dialog>
        <div id="sudoku-game">
            <div id="sudoku-board">
                <span id="pause-indicator">
                    <h2>Paused</h2>
                    <p>Click to unpause</p>
                </span>
            </div>
            <div id="sudoku-panel">
                <button id="solve-btn" class="panel-btn">Solve</button>
                <div id="panel-otherset">
                    <button id="scan-btn" class="panel-btn other-input">Scan</button>
                    <button id="new-board-btn" class="panel-btn other-input">New Board</button>
                    <button id="clear-btn" class="panel-btn other-input">Clear</button>
                </div>
                <button id="notes-toggle" class="panel-btn">Note mode:</button>
                <div id="panel-inputset">
                    <button class="panel-btn panel-input">1</button>
                    <button class="panel-btn panel-input">2</button>
                    <button class="panel-btn panel-input">3</button>
                    <button class="panel-btn panel-input">4</button>
                    <button class="panel-btn panel-input">5</button>
                    <button class="panel-btn panel-input">6</button>
                    <button class="panel-btn panel-input">7</button>
                    <button class="panel-btn panel-input">8</button>
                    <button class="panel-btn panel-input">9</button>
                    <button id="erase-btn" class="panel-btn panel-input">Erase</button>
                    <button id="timer-btn" class="panel-btn panel-input">
                        <span id="timer-icon" aria-hidden="true">
                            <svg id="icon-pause" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
                            <svg id="icon-play" viewBox="0 0 24 24"><polygon points="6,4 20,12 6,20"/></svg>
                        </span>
                        <span id="timer-label">0:00</span>
                    </button>
                </div>
            </div>
        </div>
        <footer id="credits">
            <p>Made by Uncodem . <a href="https://github.com/uncodem/sudoku" target="_blank" rel="noopener">Source</a></p>
        </footer>
        <script>
            if ("serviceWorker" in navigator) {
                navigator.serviceWorker.register("./sw.js");
            }
        </script>
        <script src="./main.js"></script>
    </body>
</html>
